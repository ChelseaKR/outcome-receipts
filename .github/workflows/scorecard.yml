name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read # Scorecard inspects dependency-update and security issue activity
      pull-requests: read # Scorecard evaluates review and branch-protection signals
      checks: read # Scorecard evaluates required-check enforcement
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: results.json
          results_format: json
          publish_results: false
      - name: Report every measured score before any of them is enforced
        # The enforcement below is a chain of `jq -e ... >/dev/null`, which
        # exits 1 and prints nothing: on 2026-09-06 this job failed three times
        # in a row on `main` and the log said only "Process completed with exit
        # code 1", naming neither the floor that broke nor the value that broke
        # it. The measurement is right there in results.json, so print it. This
        # step cannot fail the job -- it asserts nothing.
        run: |
          set -euo pipefail
          jq -r '"aggregate: \(.score)", (.checks[] | "  \(.name): \(.score)")' results.json

      - name: Enforce portfolio score floors
        run: |
          set -euo pipefail
          # WVR-006: ratchet the measured baseline while the repository-age
          # component is immutable; the waiver expires after the 90-day mark.
          # Floor is 7.0 (0.1 below the 7.1 measured 2026-08-21, so routine
          # Scorecard measurement noise doesn't fail the gate) as of the
          # docs/audits/openssf-scorecard-2026-08-21.md re-justification;
          # was 6.8 at the 2026-07-12 measurement.
          jq -e '.score >= 7.0' results.json >/dev/null
          jq -e '[.checks[] | select(.name == "Pinned-Dependencies") | .score][0] >= 9' results.json >/dev/null
          jq -e '[.checks[] | select(.name == "Token-Permissions") | .score][0] == 10' results.json >/dev/null
          jq -e '[.checks[] | select(.name == "Dangerous-Workflow") | .score][0] == 10' results.json >/dev/null
          # WVR-005: the solo-maintainer approval exception caps this at 4.
          jq -e '[.checks[] | select(.name == "Branch-Protection") | .score][0] >= 4' results.json >/dev/null
          jq -e '[.checks[] | select(.name == "Signed-Releases") | .score][0] == 10' results.json >/dev/null
          jq -e '[.checks[] | select(.name == "Vulnerabilities") | .score][0] == 10' results.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        # `if: always()` because this step used to run only after the floors
        # passed, so the one run whose results.json a reader actually needs --
        # the failing one -- was the one that never uploaded it. A gate that
        # discards the measurement it failed on cannot be diagnosed after the
        # fact, only re-run and hoped at.
        if: always()
        with:
          name: scorecard-results
          path: results.json
          retention-days: 30
          if-no-files-found: error
