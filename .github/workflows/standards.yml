name: portfolio standards

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed the same way as ci.yml, and for the same measured reason: a group
  # holds one running run and one pending run, so a third joining it cancels
  # the pending one before a single job dispatches. Keyed only on `github.ref`,
  # consecutive pushes to `main` shared one group. On 2026-09-06 that happened
  # here: run 34035866790, on commit `abde41c`, ended `cancelled` with zero jobs
  # — and `portfolio standards conformance` is a required status check on
  # `main`, so that commit carries no verdict for it. ci.yml, already fixed,
  # kept both of the same pair's runs. See ci.yml for the longer note.
  group: portfolio-standards-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: portfolio standards conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: ChelseaKR/portfolio-standards
          ref: v1.0.1
          ssh-key: ${{ secrets.STANDARDS_DEPLOY_KEY }}
          path: .standards
          persist-credentials: false
      - name: Pin and staleness checks
        run: |
          set -euo pipefail
          test "$(cat .standards-version)" = "v1.0.1"
          python3 .standards/automation/check_staleness.py --standards-dir .standards
      - name: Repository declarations and waivers
        run: |
          set -euo pipefail
          python3 scripts/check_conformance.py --standards-dir .standards
          python3 scripts/check_waivers.py --standards-dir .standards waivers.yml
