version: 1

waivers:
  - id: WVR-003
    control: SEC-10
    repo: outcome-receipts
    kind: semgrep
    reason: >-
      The registry profile applies a Python-below-3.7 compatibility rule to a
      Python-3.12-only package. importlib.resources is the correct standard-
      library API for packaged gettext catalogs; issue 53 owns retirement.
    owner: chelseakr
    granted: 2026-07-12
    expires: 2026-10-12
    link: https://github.com/ChelseaKR/outcome-receipts/issues/53

  - id: WVR-004
    control: CQ-35
    repo: outcome-receipts
    kind: other
    reason: >-
      Ruff S608 flags trusted dynamic identifiers and author-controlled report
      SQL even where identifiers are quoted and values are bound. Suppressions
      are per-line, issue-linked, and reviewed under issue 52.
    owner: chelseakr
    granted: 2026-07-12
    expires: 2026-10-12
    link: https://github.com/ChelseaKR/outcome-receipts/issues/52

  - id: WVR-005
    control: SEC-34
    repo: outcome-receipts
    kind: other
    reason: >-
      OpenSSF Branch-Protection scores 4 because GitHub cannot count the sole
      maintainer's self-review. The live ruleset still requires pull requests,
      signed linear history, resolved threads, strict checks, and no bypass.
      ADR 0002 requires raising the review count when a second maintainer exists.
    owner: chelseakr
    granted: 2026-07-12
    expires: 2026-10-12
    link: docs/adr/0002-solo-maintainer-review-count.md

  - id: WVR-006
    control: SEC-37
    repo: outcome-receipts
    kind: other
    reason: >-
      The measured aggregate is 6.8 while OpenSSF assigns zero Maintained score
      to repositories under 90 days old and zero Code-Review score to immutable
      historic solo changes. Critical checks are at target and the workflow
      ratchets 6.8 without permitting regression. Reassess after the 90-day mark.
    owner: chelseakr
    granted: 2026-07-12
    expires: 2026-10-15
    link: docs/audits/openssf-scorecard-2026-07-12.md

  - id: WVR-007
    control: SEC-12
    repo: outcome-receipts
    kind: npm-audit
    advisory: GHSA-jmr9-qjv8-65gv
    package: extract-zip
    version: 2.0.1
    severity: high
    dependency_path: >-
      pa11y@9.1.1 -> puppeteer@24.43.1 -> @puppeteer/browsers@2.13.2 ->
      extract-zip@2.0.1, and @lhci/cli@0.15.1 -> lighthouse@12.6.1 ->
      puppeteer-core@24.43.1 -> @puppeteer/browsers@2.13.2 -> extract-zip@2.0.1
    reason: >-
      extract-zip 2.0.1 does not validate symlink targets when unpacking an
      archive, so a crafted archive can write outside the extraction directory
      (CWE-22, CVSS 8.1). It is present here only as a transitive development
      dependency of the accessibility toolchain, four levels below pa11y and
      @lhci/cli, where its only job is unpacking the Chrome build that
      @puppeteer/browsers downloads from Google's own storage host. It is a
      devDependency of the quality-gate package, it is not in the published
      Python distribution, the container image, or anything a report consumer
      receives, and no shipped code path reaches it. No patched release of
      extract-zip exists as of 2026-08-15. The only remedy npm offers is
      `npm audit fix --force`, which downgrades pa11y from 9.1.1 to 6.2.3, a
      breaking major that would walk the WCAG 2.1 AA gate backwards in exchange
      for fixing a package nothing shipped ever loads. Accepted on that basis,
      to be re-reviewed on or before the expiry date below and released the
      moment extract-zip ships a fix or pa11y moves off it.
    owner: chelseakr
    granted: 2026-08-15
    expires: 2026-11-15
    link: https://github.com/advisories/GHSA-jmr9-qjv8-65gv
